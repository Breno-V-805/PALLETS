[build]
  publish = "."
  functions = "netlify/functions"

# Route /api/workflows/config to the Netlify Serverless Function
[[redirects]]
  from = "/api/workflows/config"
  to = "/.netlify/functions/workflows-config"
  status = 200

# Route /api/sns-proxy to Netlify Serverless Proxy
[[redirects]]
  from = "/api/sns-proxy"
  to = "/.netlify/functions/sns-proxy"
  status = 200

# Direct access to static config fallback
[[redirects]]
  from = "/webhooks-config.json"
  to = "/webhooks-config.json"
  status = 200

# SPA fallback for frontend views
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
